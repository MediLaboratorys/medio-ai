<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medio AI | Doktorları Güçlendiren Yapay Zeka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0a1628;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 25px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo img {
            height: 72px;
            width: auto;
        }

        .hero {
            text-align: center;
            padding: 100px 0 80px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .hero h1 span {
            color: #00d4c8;
        }

        .hero p {
            font-size: 1.25rem;
            color: #a0b3c8;
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 212, 200, 0.15);
            color: #00d4c8;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 200, 0.3);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 60px 0;
        }

        .feature-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 35px 28px;
            transition: 0.3s;
        }

        .feature-card:hover {
            border-color: rgba(0, 212, 200, 0.4);
            transform: translateY(-5px);
        }

        .feature-card h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #00d4c8;
        }

        .feature-card p {
            color: #a0b3c8;
            font-size: 1rem;
        }

        .vision {
            text-align: center;
            padding: 80px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .vision h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .vision p {
            color: #a0b3c8;
            max-width: 750px;
            margin: 0 auto;
            font-size: 1.15rem;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            color: #6b7c93;
            font-size: 0.95rem;
        }

        footer strong {
            color: #00d4c8;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="medio.png" alt="Medio AI Logo">
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="badge">Beta Versiyon • Geliştirme Aşamasında</div>
            <h1>Doktorları Güçlendiren<br><span>Yapay Zeka</span></h1>
            <p>
                Medio AI; medikal
